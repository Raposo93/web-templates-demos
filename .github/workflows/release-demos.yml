name: Validate canonical demo media
on:
  push:
    branches: [main]
    paths:
      - 'wordpress/themes/**'
      - 'tools/**'
      - 'check.sh'
      - '.github/workflows/release-demos.yml'
  pull_request:
    paths:
      - 'wordpress/themes/**'
      - 'tools/**'
      - 'check.sh'
      - '.github/workflows/release-demos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical working-media inventories
        run: ./check.sh
